name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check lossless PNG writer
        run: |
          mkdir -p "$RUNNER_TEMP/png-check"
          javac -d "$RUNNER_TEMP/png-check" \
            app/src/main/java/vn/hmtruong/photobooth/LosslessPngWriter.java \
            tools/PngWriterCheck.java
          java -cp "$RUNNER_TEMP/png-check" vn.hmtruong.photobooth.PngWriterCheck

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
